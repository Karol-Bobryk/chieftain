services: 
  frontend:
    container_name: chieftain_frontend
    volumes:
      - ./frontend:/app
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    depends_on: [backend] 
    networks:
      chieftain_net:
        ipv4_address: 192.168.25.50
  backend:
    env_file:
      - ./backend/.env
      - .env
    container_name: chieftain_backend
    volumes:
      - ./backend:/app
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      chieftain_net:
        ipv4_address: 192.168.25.100
  database:
    container_name: chieftain_database
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/docker-entrypoint-initdb.d/:ro
      - db_data:/var/lib/postgresql/data
    environment:
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_DB: chieftain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      PGUSER: ${PGUSER}
    networks:
      chieftain_net:
        ipv4_address: 192.168.25.150
    healthcheck:
      test: pg_isready -d chieftain
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
  networker:
    container_name: chieftain_networker
    image: jonlabelle/network-tools:latest
    command: "sleep 3600"
    networks:
      chieftain_net:
        ipv4_address: 192.168.25.151

volumes:
  db_data:

networks:
  chieftain_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.25.0/24
          gateway: 192.168.25.1
